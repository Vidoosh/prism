services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/failed_writes:/app/failed_writes
      - ./backend/storage:/app/storage
    environment:
      - FRONTEND_URL=http://localhost:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend

  sanity-studio:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3333"
    ports:
      - "3333:3333"
    volumes:
      - ./sanity:/app
    env_file:
      - .env
